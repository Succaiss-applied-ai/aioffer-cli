name: 本地投递回归
on:
  pull_request:
  push:
    branches: [main, feat/local-application-runtime]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - run: npm install --global pnpm@12.4.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm catalog:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:cli
      - run: pnpm check:cloud
      - run: node dist/local/cli.js doctor
